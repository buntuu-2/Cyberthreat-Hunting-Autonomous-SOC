services:
  - type: web
    name: ai-soc-command-center
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py --serve
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: FIREWALL_MODE
        value: simulation
      - key: AUTO_RESPONSE_ENABLED
        value: "True"
      - key: LLM_PROVIDER
        value: mock
      - key: MOCK_THREAT_INTEL
        value: "True"
